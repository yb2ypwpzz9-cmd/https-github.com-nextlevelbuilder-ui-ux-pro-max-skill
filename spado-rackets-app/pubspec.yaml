name: spado_rackets_app
description: App web de gestión de Spado Rackets (fichaje, asistencia, chat y cuotas).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase: el mismo stack que Spado Soccer.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.1.3

  go_router: ^14.3.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Fichaje con ubicación y subida de justificantes (imagen o PDF).
  geolocator: ^13.0.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
