<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="description" content="App de Spado Rackets: fichaje del staff, asistencia, mensajes del club y cuotas.">

  <!-- Instalable en el móvil ("Añadir a pantalla de inicio") -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spado Rackets">
  <meta name="theme-color" content="#082A47">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Spado Rackets</title>

  <!-- Pantalla de carga con la marca mientras arranca el motor gráfico, en
       lugar de una página en blanco. Se retira al pintar la app. -->
  <style>
    html, body { margin: 0; height: 100%; background: #082A47; }
    /* Comportamiento de app: sin rebote ni "tirar para recargar", sin
       resaltado al tocar y sin que el móvil cambie el tamaño del texto. */
    html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px; }
    #splash img { width: min(78vw, 360px); height: auto; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255,255,255,.15); }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      background: #D9E54A; animation: carga 1.1s ease-in-out infinite; }
    @keyframes carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Cargando Spado Rackets">
    <img src="splash_logo.png" alt="Spado Rackets">
    <div class="bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
